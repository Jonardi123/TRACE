name: Test and build native TRACE releases

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Native ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux-x64
          - runner: windows-2025
            platform: windows-x64
          - runner: macos-15
            platform: macos-arm64
          - runner: macos-15-intel
            platform: macos-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      PYTHONUTF8: '1'
      TRACE_TEST_PROGRESS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements-tested.txt
            requirements-build.txt
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk tesseract-ocr xvfb xauth fonts-dejavu-core libx11-6 libxext6 libxrender1 libfontconfig1 libfreetype6
      - name: Install pinned Python dependencies
        run: |
          python -m pip install -r requirements-tested.txt -r requirements-build.txt
          python -m pip install --no-deps -e .
      - name: Test on Linux with a virtual display
        if: runner.os == 'Linux'
        run: xvfb-run -a python packaging/run_tests.py ${{ matrix.platform }}
      - name: Test on Windows or macOS
        if: runner.os != 'Linux'
        run: python packaging/run_tests.py ${{ matrix.platform }}
      - name: Build and smoke-test native Linux executables
        if: runner.os == 'Linux'
        run: xvfb-run -a python packaging/build_release.py
      - name: Build and smoke-test native Windows/macOS executables
        if: runner.os != 'Linux'
        run: python packaging/build_release.py
      - name: Save native downloads
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error
          retention-days: 14
      - name: Save automated test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-${{ matrix.platform }}
          path: '*.junit.xml'
          if-no-files-found: warn

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: native
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-*
          path: release
          merge-multiple: true
      - name: Create source ZIP and full SHA-256 manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import hashlib, os, pathlib, subprocess, tomllib
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'Tag/version mismatch'
          subprocess.run(['git', 'archive', '--format=zip', '--prefix=trace/', '-o', f'release/TRACE-{version}-source.zip', 'HEAD'], check=True)
          assets = sorted(p for p in pathlib.Path('release').iterdir() if p.is_file() and p.name != 'SHA256SUMS.txt')
          pathlib.Path('release/SHA256SUMS.txt').write_text(''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in assets))
          PY
      - name: Publish verified build assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/* --verify-tag --title "TRACE $RELEASE_TAG" --notes-file packaging/RELEASE_NOTES.md --latest
