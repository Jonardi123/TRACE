[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "osint-workbench"
version = "0.2.1"
description = "TRACE: local public-evidence OSINT investigation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Pillow>=11.3,<14", "pytesseract>=0.3.13,<0.4", "requests>=2.32.4,<3", "filelock>=3.18,<4"]
license = "MIT"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-timeout>=2.4,<3"]
build = ["pyinstaller>=6.16,<7"]

[project.scripts]
trace-osint = "osint_workbench.__main__:main"
osint-workbench = "osint_workbench.__main__:main"

[tool.setuptools.packages.find]
include = ["osint_workbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
